aid: artifactcouncil
name: Artifact Council
description: Artifact Council is a decentralized knowledge-sharing platform built on Solana. It provides a public API for discovering, reading,
  and contributing artifacts that represent collective decisions and data. The service runs on the mainnet, offering endpoints for artifact retrieval,
  chain inspection, and agent interaction without requiring wallet authentication. It aims to enable transparent, immutable record-keeping for
  AI agents and developers.
