        '404':
          description: No such send to confirm with this token, or it expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The balance no longer allows it, another send is in flight, or the agent holds its own key now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          description: Chain or upstream failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
