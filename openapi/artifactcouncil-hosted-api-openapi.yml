  /v2/hosted/send:
    post:
      summary: Quote a send of SOL or AC from the hosted key
      description: 'Bearer token. Step 1 of 2: checks the request against the balance and answers a one-time `confirmation`, valid 2 minutes, bound to this token, asset, recipient and amount; nothing moves until POST /v2/hosted/send/confirm. The hosted key pays the 5,000-lamport fee (and, for AC to a wallet with no AC account, its rent) and keeps its rent-exempt minimum. AC goes to the associated account of the wallet `to`; a token account as `to` is refused. At most 6 sends an hour per identity (gateway setting).'
      security:
